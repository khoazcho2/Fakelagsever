services:
  - type: web
    name: key-server
    env: docker
    plan: free
    envVars:
      - key: ADMIN_PASSWORD
        value: Quocdz2006@
      - key: ADMIN_USERNAME
        value: Quocdz2006
      # Sao lưu tự động chống mất dữ liệu khi container restart/redeploy.
      # Để trống thì hệ thống vẫn chạy bình thường, chỉ là không sao lưu.
      # FIREBASE_SERVICE_ACCOUNT_JSON = dán TOÀN BỘ nội dung file JSON tải
      # về khi bấm "Generate new private key" trong Firebase Console.
      # KHÔNG BAO GIỜ commit giá trị thật của biến này vào code/GitHub -
      # chỉ set trực tiếp trên Render Dashboard (Environment tab).
      - key: FIREBASE_DB_URL
        value: ""
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        value: ""
